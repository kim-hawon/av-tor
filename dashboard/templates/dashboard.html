<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AV-TOR 제어권 전환 대시보드</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
        }

        .time-filter {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn.active {
            background: #667eea;
            color: white;
        }

        .btn:not(.active) {
            background: #f0f0f0;
            color: #333;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .stat-card h3 {
            color: #999;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 36px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }

        .stat-subtitle {
            color: #999;
            font-size: 12px;
        }

        .stat-card.success .stat-value {
            color: #10b981;
        }

        .stat-card.fail .stat-value {
            color: #ef4444;
        }

        .stat-card.rate .stat-value {
            color: #f59e0b;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .chart-container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .chart-container h3 {
            color: #333;
            font-size: 16px;
            margin-bottom: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .chart-wrapper {
            position: relative;
            height: 300px;
        }

        .events-container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .events-container h3 {
            color: #333;
            font-size: 16px;
            margin-bottom: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .event-item {
            padding: 15px;
            border-left: 4px solid #667eea;
            background: #f9f9f9;
            margin-bottom: 10px;
            border-radius: 5px;
        }

        .event-item.success {
            border-left-color: #10b981;
        }

        .event-item.fail {
            border-left-color: #ef4444;
        }

        .event-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .event-title {
            font-weight: 600;
            color: #333;
        }

        .event-status {
            font-size: 12px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 20px;
        }

        .event-status.success {
            background: #d1fae5;
            color: #065f46;
        }

        .event-status.fail {
            background: #fee2e2;
            color: #991b1b;
        }

        .event-time {
            font-size: 12px;
            color: #999;
        }

        .event-detail {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 18px;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        footer {
            text-align: center;
            color: white;
            margin-top: 40px;
            font-size: 12px;
        }

        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }

            .charts-grid {
                grid-template-columns: 1fr;
            }

            .time-filter {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚗 AV-TOR 제어권 전환 대시보드</h1>
            <p class="subtitle">자율주행차 제어권 전환 시스템 모니터링</p>
            
            <div class="time-filter">
                <button class="btn" data-days="1" onclick="loadData(1)">지난 24시간</button>
                <button class="btn active" data-days="7" onclick="loadData(7)">지난 7일</button>
                <button class="btn" data-days="31" onclick="loadData(31)">지난 31일</button>
                <button class="btn" data-days="0" onclick="loadData(0)">전체</button>
            </div>
        </header>

        <div class="stats-grid" id="stats-container">
            <div class="loading">데이터 로딩 중...</div>
        </div>

        <div class="charts-grid">
            <div class="chart-container">
                <h3>📊 성공/실패 현황</h3>
                <div class="chart-wrapper">
                    <canvas id="successChart"></canvas>
                </div>
            </div>

            <div class="chart-container">
                <h3>⚠️ 실패 원인</h3>
                <div class="chart-wrapper">
                    <canvas id="failureChart"></canvas>
                </div>
            </div>
        </div>

        <div class="events-container">
            <h3>📋 최근 제어권 전환 시도</h3>
            <div id="events-list" class="loading">이벤트 로딩 중...</div>
        </div>

        <footer>
            <p>마지막 업데이트: <span id="update-time">-</span></p>
            <p>AV-TOR © 2026</p>
        </footer>
    </div>

    <script>
        let currentDays = 7;
        let successChart = null;
        let failureChart = null;

        function updateTime() {
            document.getElementById('update-time').textContent = new Date().toLocaleString('ko-KR');
        }

        function loadData(days) {
            currentDays = days;
            
            // 필터 버튼 업데이트
            document.querySelectorAll('.time-filter .btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            // 데이터 로드
            Promise.all([
                fetch(`/api/stats?days=${days}`).then(r => r.json()),
                fetch(`/api/events?days=${days}&limit=50`).then(r => r.json())
            ]).then(([stats, events]) => {
                updateStats(stats);
                updateCharts(stats);
                updateEvents(events);
                updateTime();
            }).catch(err => {
                console.error('데이터 로드 오류:', err);
                document.getElementById('stats-container').innerHTML = 
                    '<div class="error">데이터 로드 실패. 다시 시도해주세요.</div>';
            });
        }

        function updateStats(stats) {
            const html = `
                <div class="stat-card">
                    <h3>전체 시도</h3>
                    <div class="stat-value">${stats.total}</div>
                    <div class="stat-subtitle">건</div>
                </div>
                <div class="stat-card success">
                    <h3>성공</h3>
                    <div class="stat-value">${stats.success}</div>
                    <div class="stat-subtitle">${stats.success > 0 ? '(' + ((stats.success / stats.total * 100).toFixed(1)) + '%)' : ''}</div>
                </div>
                <div class="stat-card fail">
                    <h3>실패</h3>
                    <div class="stat-value">${stats.fail}</div>
                    <div class="stat-subtitle">${stats.fail > 0 ? '(' + ((stats.fail / stats.total * 100).toFixed(1)) + '%)' : ''}</div>
                </div>
                <div class="stat-card rate">
                    <h3>성공률</h3>
                    <div class="stat-value">${stats.success_rate.toFixed(1)}%</div>
                    <div class="stat-subtitle">전체 평균</div>
                </div>
            `;
            document.getElementById('stats-container').innerHTML = html;
        }

        function updateCharts(stats) {
            // 성공/실패 차트
            const successCtx = document.getElementById('successChart').getContext('2d');
            if (successChart) successChart.destroy();
            successChart = new Chart(successCtx, {
                type: 'doughnut',
                data: {
                    labels: ['성공', '실패'],
                    datasets: [{
                        data: [stats.success, stats.fail],
                        backgroundColor: ['#10b981', '#ef4444'],
                        borderColor: ['#059669', '#dc2626'],
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom' }
                    }
                }
            });

            // 실패 원인 차트
            const failureCtx = document.getElementById('failureChart').getContext('2d');
            if (failureChart) failureChart.destroy();
            
            const reasons = stats.fail_reasons;
            const reasonLabels = Object.keys(reasons);
            const reasonValues = Object.values(reasons);

            failureChart = new Chart(failureCtx, {
                type: 'bar',
                data: {
                    labels: reasonLabels.length > 0 ? reasonLabels : ['데이터 없음'],
                    datasets: [{
                        label: '실패 횟수',
                        data: reasonValues.length > 0 ? reasonValues : [0],
                        backgroundColor: '#ef4444',
                        borderColor: '#dc2626',
                        borderWidth: 1
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        x: { beginAtZero: true }
                    }
                }
            });
        }

        function updateEvents(events) {
            if (events.length === 0) {
                document.getElementById('events-list').innerHTML = 
                    '<p style="text-align: center; color: #999;">이벤트가 없습니다.</p>';
                return;
            }

            const html = events.map(session => {
                const status = session.status || 'pending';
                const statusClass = status === 'success' ? 'success' : 'fail';
                const statusText = status === 'success' ? '✓ 성공' : '✗ 실패';
                const startTime = new Date(session.start_time).toLocaleString('ko-KR');
                
                return `
                    <div class="event-item ${statusClass}">
                        <div class="event-header">
                            <div class="event-title">${session.scenario}</div>
                            <span class="event-status ${statusClass}">${statusText}</span>
                        </div>
                        <div class="event-time">${startTime}</div>
                        <div class="event-detail">세션 ID: ${session.session_id}</div>
                    </div>
                `;
            }).join('');

            document.getElementById('events-list').innerHTML = html;
        }

        // 초기 로드
        loadData(7);
        setInterval(updateTime, 1000);
    </script>
</body>
</html>
