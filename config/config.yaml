voice:
  model_path: "./models/vosk-en"
  samplerate: 16000
  blocksize: 4000
  vocab:
    - lane
    - one
    - sixty
    - four
    - forty
    - "[unk]"

# 시나리오 정의
#   key          : 입력 키워드 (예: "const 400" 의 const)
#   param.default: 키워드만 입력했을 때 쓰는 기본 수치 (예: const 만 입력 → 400)
#   param.unit   : 수치 단위 (참고용)
#   lcd.phase1   : PHASE1 LCD 1행 경고 템플릿. {v} 자리에 입력 수치가 들어감
#   lcd.phase2   : PHASE2 LCD 1행 동작 지시 (TTS 안내 내용)
scenarios:
  - id: 1
    key: const
    label: "Construction Zone"
    audio: "./audio/const.wav"
    answer: "lane one"
    param: { default: 400, unit: m }
    lcd:
      phase1: "WARN:{v}m"
      phase2: "Lane 1 GO"
  - id: 2
    key: rain
    label: "Rain"
    audio: "./audio/rain.wav"
    answer: "sixty four"
    param: { default: 20, unit: mmh }
    lcd:
      phase1: "RAIN {v}mmh"
      phase2: "Slow 64kmh"
  - id: 3
    key: fog
    label: "Fog"
    audio: "./audio/fog.wav"
    answer: "forty"
    param: { default: 30, unit: m }
    lcd:
      phase1: "FOG vis{v}m"
      phase2: "Slow 40kmh"
  - id: 4
    key: icy
    label: "Icy Road"
    audio: "./audio/ice.wav"
    answer: "forty"
    param: { default: -5, unit: C }
    lcd:
      phase1: "ICY {v}C"
      phase2: "Slow 40 NoLC"

# 차량 기본 설정
vehicle:
  basic_speed: 80 # km/h, 기본 속도 (80키로로 가정)

# 시나리오 설정
scenario:
  construction_distance: 400 # m, 공사 구간 TOR 시작 거리
  distance_update_step: 50 # m, LCD 갱신 단위

# 감속 목표 (km/h), 자동차 전용 도로(80km/h) 가정
speed_target:
  rain: 64 # 우천 (20% 감속)
  fog: 40 # 안개 (50% 감속)
  ice: 40 # 결빙 (50% 감속)

# 제어권 전환 시간 예산 (초)
timing:
  tor_budget: 10 # 기본 TOR 시간
  voice_extra: 3 # 음성 실패 시 유예 시간
  warning_urgent: 5 # 부저 가속 시작 (잔여)
  warning_critical: 3 # 부저 최대 (잔여)
  end_screen_duration: 3 # 종료 화면 유지 시간
  voice_listen: 12 # PHASE2 실제 STT 리드백 대기 한도(초). 초과 시 실패→MRM

# 더미 설정 (센서 연결 전 시뮬레이션)
dummy:
  gaze_ok_after: 3 # n초 후 자동으로 시선 OK
  grip_ok_after: 4 # n초 후 자동으로 핸들 OK (use_real_grip=false 일 때 적용)
  voice_ok: false # 음성 인식 자동 성공 여부 (use_real_voice=false 일 때 적용)
  use_real_voice: true # true면 팀원의 실제 Vosk STT 호출 (마이크/모델/wav 필요)
  use_real_grip: true # true면 실제 터치 센서 사용. false면 grip_ok_after 시간 기반 더미.

# ──────────────────────────────────────────────────────────────
# HMI 하드웨어 설정 (라즈베리파이)
#   force_sim: true 면 라파에서도 강제로 콘솔 시뮬레이션 (배선 전 로직 테스트용)
#   라파가 아니거나 RPi.GPIO 가 없으면 자동으로 SIM 모드로 폴백.
#   pins 는 BCM 번호. I2C(LCD)는 GPIO2(SDA)/GPIO3(SCL) 고정이라 여기 없음.
# ──────────────────────────────────────────────────────────────
hmi:
  force_sim: false
  pins:
    led_red: 17 # 경고 LED (빨강)
    led_green: 27 # 정상/수동전환 LED (초록)
    buzzer: 22 # 능동 부저
    vibration: 23 # 진동 모터 (트랜지스터/드라이버 경유)
    grip_touch: 24 # 핸들 터치 센서 (입력)
  buzzer_active_high: true # 부저 ON = HIGH
  vibration_active_high: true # 진동 ON = HIGH
  grip_active_high: true # 터치 감지 = HIGH (센서에 맞게 조정)
  lcd:
    cols: 20 # 20x4 캐릭터 LCD
    rows: 4
    i2c_address: 0x27 # PCF8574 백팩 주소 (보통 0x27 또는 0x3F)
    i2c_port: 1

# 입력 센서 캡쳐 설정
capture:
  out_dir: "./data/captures" # 녹음/캡쳐 결과 저장 위치 (.gitignore 처리됨)
  voice_seconds: 4 # voice raw 녹음 길이 (초)
  camera_index: 0 # gaze 카메라 인덱스

# ──────────────────────────────────────────────────────────────
# 텔레그램 알림 (제어권 전환 성공/실패 시 메시지 전송)
#   bot_token / chat_id 는 환경변수(TG_BOT_TOKEN, TG_CHAT_ID)로 주는 것을 권장.
#   yaml 값과 환경변수가 모두 있으면 환경변수가 우선.
# ──────────────────────────────────────────────────────────────
telegram:
  enabled: true
  bot_token: "" # 비워두면 환경변수 TG_BOT_TOKEN 사용
  chat_id: "" # 비워두면 환경변수 TG_CHAT_ID 사용
  timeout: 3 # HTTP 타임아웃(초)
